# One PostgreSQL instance with a 1Gi volume. Local demo only: no backup, no HA.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: quotagate
            - name: POSTGRES_DB
              value: quotagate
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quotagate-secrets
                  key: QG_DB_PASSWORD
            # A subdirectory: some volume types put lost+found at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quotagate", "-d", "quotagate"]
            periodSeconds: 3
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
