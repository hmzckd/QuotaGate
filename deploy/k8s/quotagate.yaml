# Two serve-combined copies behind one Service, like compose.qg08.yaml.
apiVersion: v1
kind: Service
metadata:
  name: quotagate
spec:
  selector:
    app: quotagate
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quotagate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quotagate
  strategy:
    rollingUpdate:
      # Start the new copy before stopping an old one: two stay ready.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: quotagate
    spec:
      # 5s preStop + up to 10s graceful shutdown (QG-10), plus margin.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Every copy runs migrations before it starts. The migration runner
        # holds a PostgreSQL advisory lock, so two copies never migrate at once.
        - name: migrate
          image: quotagate:local
          args: ["migrate"]
          env:
            - name: QG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quotagate-secrets
                  key: QG_DB_PASSWORD
            - name: DATABASE_URL
              value: postgres://quotagate:$(QG_DB_PASSWORD)@postgres:5432/quotagate?sslmode=disable
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: quotagate
          image: quotagate:local
          args: ["serve-combined"]
          env:
            - name: QG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quotagate-secrets
                  key: QG_DB_PASSWORD
            # $(QG_DB_PASSWORD) is filled in by Kubernetes from the variable above.
            - name: DATABASE_URL
              value: postgres://quotagate:$(QG_DB_PASSWORD)@postgres:5432/quotagate?sslmode=disable
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quotagate-secrets
                  key: QG_ADMIN_TOKEN
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: HTTP_ADDR
              value: ":8080"
          ports:
            - name: http
              containerPort: 8080
          # Ready only when PostgreSQL and Redis answer (QG-09): no traffic otherwise.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          # Live only checks the process, so a dependency outage never restarts it.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Removing a terminating pod from the Service takes a moment to
            # reach every node. Wait before SIGTERM so no new request is lost.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
