# v0.3 load comparison: a second example API without the QuotaGate middleware.
# Apply after compose.yaml and compose.qg08.yaml with a separate project name (quotagate-qg11).
services:
  example-api-baseline:
    build:
      context: .
      target: example-api
    environment:
      # Load-test baseline only: every /jobs request runs the handler.
      QUOTAGATE_MIDDLEWARE: "off"
      HTTP_ADDR: :8081
    ports:
      - "127.0.0.1:${QG_BASELINE_PORT:-18083}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/live"]
      interval: 3s
      timeout: 2s
      retries: 15
