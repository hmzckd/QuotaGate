# v0.2: two combined decision services sharing one PostgreSQL and one Redis.
# Apply after compose.yaml with a separate project name (quotagate-qg08).
x-combined-api: &combined-api
  build: .
  command: ["serve-combined"]
  environment:
    DATABASE_URL: postgres://quotagate:${QG_DB_PASSWORD:?Set QG_DB_PASSWORD in .env.compose}@db:5432/quotagate?sslmode=disable
    ADMIN_TOKEN: ${QG_ADMIN_TOKEN:?Set QG_ADMIN_TOKEN in .env.compose}
    REDIS_URL: redis://redis:6379/0
    HTTP_ADDR: :8080
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
    interval: 3s
    timeout: 2s
    retries: 15

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${QG_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15

  api:
    <<: *combined-api

  api-2:
    <<: *combined-api
    ports:
      - "127.0.0.1:${QG_HTTP_2_PORT:-18082}:8080"
